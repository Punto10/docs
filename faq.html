  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ol><\u002Fdiv><\u002Fdiv>\n<div style=\"break-before:page\"><section id=\"s-1\" style=\"margin:0 0 8px\"><h2 style=\"margin:36px 0 18px;padding:0 0 8px;border-bottom:1px solid #d8d0c6;font-family:'Libre Baskerville',Georgia,serif;font-weight:400;font-size:24px;line-height:1.25;text-transform:uppercase;letter-spacing:.03em;color:#2b2622\">1. Informazioni Generali<\u002Fh2><div id=\"q-71\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">1.1 Perchè \"Punto\"<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\"><ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Punto come inizio <\u002Fstrong>- Ogni cambiamento inizia da un punto. Un nuovo look, una nuova immagine, una nuova fase della vita.<\u002Fli><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Punto di riferimento<\u002Fstrong> - Vogliamo essere un punto di riferimento per chi cerca qualità, professionalità e attenzione alla persona.<\u002Fli><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Punto d’incontro<\u002Fstrong> - Un luogo dove persone, idee, stile e benessere si incontrano.<\u002Fli><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Punto di equilibrio<\u002Fstrong> - Bellezza significa armonia tra immagine esteriore e benessere interiore.<\u002Fli><\u002Ful>Per noi, <strong style=\"font-weight:700\">Punto 10<\u002Fstrong> rappresenta la ricerca continua dell'eccellenza, dell'armonia e della crescita personale, senza perdere il fascino di ciò che resta ancora da scoprire. <\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-72\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">1.2 Perchè \"10\"<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\"><ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">10<\u002Fstrong> è il progenitore di tutti i numeri, poiché rappresenta l'unione dello <strong style=\"font-weight:700\">zero<\u002Fstrong>, principio femminile, e dell'<strong style=\"font-weight:700\">uno<\u002Fstrong>, principio maschile.<\u002Fli><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">10<\u002Fstrong> è un numero che attrae la fortuna. Non una fortuna qualunque, ma una benedizione superiore: il dieci è considerato uno dei numeri divini ed è riconosciuto come tale in numerose tradizioni spirituali e culturali del mondo.<\u002Fli><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">10<\u002Fstrong> è il numero dell'amore più elevato e della saggezza più profonda.<\u002Fli><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">10<\u002Fstrong> simboleggia la perfezione e il compimento. La perfezione riguarda lo spirito dell'essere umano, mentre il compimento si manifesta nel corpo, nei pensieri e nelle azioni.<\u002Fli><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">10<\u002Fstrong> rappresenta ogni nostra capacità sviluppata al massimo delle sue potenzialità.<\u002Fli><\u002Ful>e non solo…<br><ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">In Giappone si ritiene che in ogni cosa debba esserci un piccolo spazio per il mistero: circa un 10% di ciò che resta inesplorato e affascinante.<\u002Fli><li style=\"margin:0 0 4px\">Nella Bibbia troviamo i <strong style=\"font-weight:700\">Dieci Comandamenti<\u002Fstrong>, principi fondamentali che guidano il comportamento umano e il rapporto con il divino.<\u002Fli><\u002Ful>Per noi, <strong style=\"font-weight:700\">Punto 10<\u002Fstrong> rappresenta la ricerca continua dell'eccellenza, dell'armonia e della crescita personale, senza perdere il fascino di ciò che resta ancora da scoprire.<\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-2\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">1.3 Consulenza gratuita di 30 minuti<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">La consulenza è un servizio gratuito consigliato nei seguenti casi:<ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">Primo appuntamento presso il salone<\u002Fli><li style=\"margin:0 0 4px\">Cambiamento della condizione dei capelli rispetto all’ultima visita<\u002Fli><\u002Ful>L’obiettivo della consulenza è:<ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">Definire in dettaglio i protocolli dei servizi richiesti dal cliente<\u002Fli><li style=\"margin:0 0 4px\">Proporre, previo accordo con il cliente, eventuali servizi aggiuntivi (ad esempio trattamenti o cure specifiche)<\u002Fli><li style=\"margin:0 0 4px\">Elaborare un <a href=\"#q-4\" style=\"color:#b4553a;text-decoration:underline\">preventivo personalizzato<\u002Fa><\u002Fli><\u002Ful>L’appuntamento può essere fissato:<ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">Online, tramite l’invio di un video<\u002Fli><li style=\"margin:0 0 4px\">Direttamente in salone (modalità <strong style=\"font-weight:700\">consigliata<\u002Fstrong>)<\u002Fli><li style=\"margin:0 0 4px\">Telefonicamente al <a href=\"tel:+393298763395\" style=\"color:#b4553a;text-decoration:underline\">+39 329 876 33 95<\u002Fa><\u002Fli><li style=\"margin:0 0 4px\">Tramite <a href=\"https://punto10.altegio.me/\" style=\"color:#b4553a;text-decoration:underline\">link<\u002Fa> dedicato.<\u002Fli><\u002Ful><\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-3\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">1.4 Cosa si intende per “Rifiuto del servizio?”<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Ci riserviamo il diritto di rifiutare la prestazione di un determinato servizio senza fornire spiegazioni.<\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-4\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">1.5 Preventivo personalizzato<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Il documento viene redatto durante la consulenza, sulla base delle richieste e delle esigenze espresse dal cliente, e include le seguenti informazioni:<ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">Nome e cognome del consulente<\u002Fli><li style=\"margin:0 0 4px\">Nome e cognome del cliente<\u002Fli><li style=\"margin:0 0 4px\">Nome, cognome, livello e tariffa della persona incaricata dell’esecuzione del lavoro<\u002Fli><li style=\"margin:0 0 4px\">Costo minimo e massimo di ciascun servizio e trattamento concordato<\u002Fli><li style=\"margin:0 0 4px\">Durata complessiva prevista (tempo minimo e massimo stimato per l’appuntamento)<\u002Fli><li style=\"margin:0 0 4px\">Totali: costo minimo e massimo calcolati prima dell’applicazione di eventuali sconti<\u002Fli><li style=\"margin:0 0 4px\">Sconto applicato<\u002Fli><li style=\"margin:0 0 4px\">Totali: costo minimo e massimo dopo l’applicazione dello sconto<\u002Fli><li style=\"margin:0 0 4px\">Informativa privacy ai sensi del GDPR, con le scelte effettuate e la firma dei moduli corrispondenti<\u002Fli><li style=\"margin:0 0 4px\">Spazio dedicato a commenti e note, per specificare eventuali richieste particolari, condizioni aggiuntive o raccomandazioni fornite dal consulente<\u002Fli><li style=\"margin:0 0 4px\">Validità del preventivo, con indicazione della data di scadenza<\u002Fli><li style=\"margin:0 0 4px\">Data, ora e città in cui il preventivo viene firmato<\u002Fli><li style=\"margin:0 0 4px\">Firma del cliente<\u002Fli><li style=\"margin:0 0 4px\">Firma del consulente<\u002Fli><\u002Ful>Il presente documento costituisce un riferimento formale in caso di eventuali controversie future.<\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-70\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">1.6 Variazione dei costi preventivati<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">L’importo totale definito durante la consulenza può subire variazioni nei seguenti casi:<ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">arrivo del cliente con un ritardo superiore ai 15 minuti;<\u002Fli><li style=\"margin:0 0 4px\">condizioni reali dei capelli diverse da quanto valutato inizialmente;<\u002Fli><li style=\"margin:0 0 4px\">modifica della richiesta durante il servizio, ad esempio:<ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">variazione del colore o del risultato desiderato;<\u002Fli><li style=\"margin:0 0 4px\">aggiunta di trattamenti;<\u002Fli><\u002Ful><\u002Fli><li style=\"margin:0 0 4px\">necessità tecniche emerse nel corso del lavoro, ad esempio:<ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">correzione del colore;<\u002Fli><li style=\"margin:0 0 4px\">neutralizzazione di pigmenti indesiderati;<\u002Fli><li style=\"margin:0 0 4px\">passaggi intermedi non programmati (decolorazioni multiple, pre-trattamenti, ecc.);<\u002Fli><\u002Ful><\u002Fli><li style=\"margin:0 0 4px\">tempi di lavorazione più lunghi del previsto (oltre 15 minuti), dovuti per esempio a:<ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">risposta del capello più lenta;<\u002Fli><li style=\"margin:0 0 4px\">necessità di pause tecniche;<\u002Fli><li style=\"margin:0 0 4px\">raggiungimento del risultato possibile solo attraverso più fasi operative.<\u002Fli><\u002Ful><\u002Fli><\u002Ful>Nota: si tratta di situazioni rare, generalmente individuate e condivise già durante la consulenza.<\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-5\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">1.7 GDPR<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Il <strong style=\"font-weight:700\">GDPR (General Data Protection Regulation)<\u002Fstrong> è il Regolamento Generale sulla Protezione dei Dati (Regolamento UE 2016/679), entrato in vigore il 25 maggio 2018, che disciplina il trattamento e la protezione dei dati personali all'interno dell'Unione Europea.<br>L'obiettivo principale del GDPR è garantire ai cittadini un maggiore controllo sui propri dati personali e imporre alle aziende e organizzazioni regole più rigide sulla raccolta, l'elaborazione e la conservazione di tali dati.<br>Principali aspetti del GDPR:<ol style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Trasparenza e consenso<\u002Fstrong> – Le aziende devono informare chiaramente gli utenti su come vengono utilizzati i loro dati e ottenere un consenso esplicito.<\u002Fli><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Diritto alla privacy<\u002Fstrong> – Gli utenti hanno il diritto di accedere, correggere o cancellare i propri dati personali.<\u002Fli><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Sicurezza dei dati<\u002Fstrong> – Le organizzazioni devono adottare misure adeguate per proteggere i dati da violazioni o accessi non autorizzati.<\u002Fli><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Responsabilità delle aziende<\u002Fstrong> – Le imprese devono dimostrare la conformità al GDPR e possono essere soggette a <strong style=\"font-weight:700\">sanzioni<\u002Fstrong> in caso di violazione.<\u002Fli><\u002Fol>Il nostro sito web, così come gli altri sistemi da noi utilizzati (ad esempio il gestionale), sono conformi al regolamento sopraindicato.<\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-6\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">1.8 Prenotazione online<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Un servizio molto pratico che consente di prenotare i trattamenti desiderati in qualsiasi momento (24/7).<br><br>Utilizza il <a href=\"https://punto10.altegio.me/\" style=\"color:#b4553a;text-decoration:underline\">link<\u002Fa> per selezionare i servizi, la data e l'orario più adatti a te. <br><br>Informazioni utili:<ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\"><a href=\"#q-7\" style=\"color:#b4553a;text-decoration:underline\">Il prezzo del servizio<\u002Fa><\u002Fli><li style=\"margin:0 0 4px\"><a href=\"#q-8\" style=\"color:#b4553a;text-decoration:underline\">Servizio contrassegnato con il simbolo “!” nel titolo<\u002Fa><\u002Fli><\u002Ful><\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-7\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">1.9 Il prezzo del servizio<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Nella <a href=\"https://www.punto10.it/servizi\" style=\"color:#b4553a;text-decoration:underline\">pagina<\u002Fa> del sito, il costo del servizio può essere indicato nei seguenti modi:<ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Valore singolo - <\u002Fstrong> prezzo fisso del servizio<\u002Fli><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Intervallo di valori<\u002Fstrong> - prezzo minimo e massimo del servizio, determinato con maggiore precisione durante la consulenza<\u002Fli><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Valore assente<\u002Fstrong> - nei casi particolari e molto complessi, per esempio Passaggio (transizione) da colore scuro e Colorazione creativa, quando il protocollo di colorazione, la quantità di <a href=\"#q-17\" style=\"color:#b4553a;text-decoration:underline\">decapaggio<\u002Fa> e il costo del trattamento saranno concordati durante la <a href=\"#q-2\" style=\"color:#b4553a;text-decoration:underline\">consulenza <\u002Fa>prevista a seguito del <strong style=\"font-weight:700\">test-ciocca.<\u002Fstrong><\u002Fli><\u002Ful>Vi preghiamo di fare un particolare attenzione ai <a href=\"#q-8\" style=\"color:#b4553a;text-decoration:underline\">servizi contrassegnati coi il simbolo “!” nel titolo<\u002Fa><br><br>Informazioni utili:<ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\"><a href=\"#q-9\" style=\"color:#b4553a;text-decoration:underline\">Da che cosa dipende il prezzo<\u002Fa><\u002Fli><\u002Ful><\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-8\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">1.10 Servizio contrassegnato con il simbolo “!” nel titolo<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">I servizi contrassegnati dal simbolo “<strong style=\"font-weight:700\">!<\u002Fstrong>” nel titolo appartengono alla categoria <a href=\"#q-19\" style=\"color:#b4553a;text-decoration:underline\">lavoro complesso<\u002Fa>.<br><ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">La prenotazione di questo tipo di servizio riserva il tempo massimo previsto per la sua esecuzione, senza specificarne la composizione dettagliata o il costo finale<\u002Fli><\u002Ful><ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">La fascia di prezzo indicata nel titolo si riferisce esclusivamente alla tecnica principale (ad esempio, <a href=\"#q-37\" style=\"color:#b4553a;text-decoration:underline\">Air <\u002Fa><a href=\"#q-37\" style=\"color:#b4553a;text-decoration:underline\">Touch<\u002Fa>) e <strong style=\"font-weight:700\">non include<\u002Fstrong> eventuali trattamenti aggiuntivi (come tonalizzazioni, trattamenti di cura, ecc.), che possono essere integrati:<ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Autonomamente dall’amministrazione<\u002Fstrong> per i clienti abituali, sulla base delle prenotazioni precedenti<\u002Fli><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">In fase di consulenza con il professionista<\u002Fstrong> per i nuovi clienti<\u002Fli><\u002Ful><\u002Fli><\u002Ful><ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">Dopo ogni modifica, sia da remoto che in fase di <a href=\"#q-2\" style=\"color:#b4553a;text-decoration:underline\">consulenza<\u002Fa>, il cliente riceverà una notifica con il dettaglio aggiornato dei servizi prenotati e dell’orario stabilito.<\u002Fli><\u002Ful><\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-9\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">1.11 Da che cosa dipende il prezzo?<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Per i trattamenti di “<strong style=\"font-weight:700\">Capelli”<\u002Fstrong>, il prezzo varia generalmente in base a<ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">lunghezza dei capello<\u002Fli><li style=\"margin:0 0 4px\">densità del capello<\u002Fli><li style=\"margin:0 0 4px\">struttura dei capelli<\u002Fli><li style=\"margin:0 0 4px\">complessità e tempo impiegato per il trattamento/servizio.<\u002Fli><\u002Ful><\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-10\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">1.12 Il sito www.punto10.it<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Il sito web dove ci sono i seguenti sezi 02Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-14\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">1.16 Trattamento di base (lavaggio)<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Si tratta di un servizio supplementare, abbinabile ad altri trattamenti nei quali non sia già incluso. Sebbene si tratti di una circostanza piuttosto rara, il cliente viene sempre informato preventivamente, poiché il servizio comporta un prolungamento della durata complessiva del trattamento (tra 10 e 20 minuti) e un costo aggiuntivo variabile tra 10 ed 20 euro.<br><br>Le caratteristiche principali del servizio:<ol style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Shampoo - <\u002Fstrong>Deterge delicatamente il cuoio capelluto e i capelli, rimuovendo impurità, sebo in eccesso e residui di prodotti. Prepara i capelli ai trattamenti successivi, lasciandoli freschi e puliti.<\u002Fli><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Conditioner - <\u002Fstrong>Districa, ammorbidisce e nutre la fibra capillare. Aiuta a chiudere le cuticole dopo lo shampoo, rendendo i capelli più lisci, luminosi e facili da pettinare.<\u002Fli><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Hair Milk - <\u002Fstrong>È un trattamento leave-in leggero, spesso a base di latte o derivati vegetali. Idrata, protegge e dona elasticità ai capelli senza appesantirli. Ideale per mantenere morbidezza e gestibilità durante la giornata.<\u002Fli><\u002Fol><\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-15\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">1.17 Asciugatura<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Si tratta di un servizio supplementare, abbinabile ad altri trattamenti nei quali non sia già incluso. Sebbene si tratti di una circostanza piuttosto rara, il cliente viene sempre informato preventivamente, poiché il servizio comporta un prolungamento della durata complessiva del trattamento (tra 10 e 30 minuti) e un costo aggiuntivo variabile tra 10 ed 30 euro.<br><br>Le caratteristiche principali del servizio:<ol style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">L’asciugatura è la fase finale del trattamento che valorizza il taglio, la piega e la struttura dei capelli. <\u002Fli><li style=\"margin:0 0 4px\">Serve a definire la forma desiderata, donare volume e lucentezza, e garantire una resa duratura dello styling. <\u002Fli><li style=\"margin:0 0 4px\">Può essere naturale o realizzata con tecniche specifiche in base al tipo di capello e all’effetto finale richiesto.<\u002Fli><\u002Fol><\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-16\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">1.18 Pre-pigmentazione<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Si tratta di un servizio supplementare, abbinabile ad altri trattamenti nei quali non sia già incluso. Sebbene si tratti di una circostanza piuttosto rara, il cliente viene sempre informato preventivamente, poiché il servizio comporta un prolungamento della durata complessiva del trattamento (tra 20 e 30 minuti) e un costo aggiuntivo variabile tra 13 ed 26 euro.<br><br>Le caratteristiche principali del servizio:<br>1. <strong style=\"font-weight:700\">Preparazione del capello<\u002Fstrong> – Processo utilizzato per riempire la struttura del capello con pigmenti prima della colorazione, essenziale per colori intensi e duraturi.<br>2. <strong style=\"font-weight:700\">Migliore tenuta del colore<\u002Fstrong> – Indispensabile per evitare sbiadimenti prematuri, soprattutto su capelli porosi o molto chiari.<br>3. <strong style=\"font-weight:700\">Uniformità del risultato<\u002Fstrong> – Aiuta a ottenere un colore più omogeneo e profondo, riducendo il rischio di viraggi indesiderati.<\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-17\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">1.19 Decapaggio<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Si tratta di un servizio supplementare, abbinabile ad altri trattamenti nei quali non sia già incluso. Sebbene si tratti di una circostanza piuttosto rara, il cliente viene sempre informato preventivamente, poiché il servizio comporta un prolungamento della durata complessiva del trattamento (tra 20 e 30 minuti) e un costo aggiuntivo variabile tra 13 ed 26 euro.<br><br>Le caratteristiche principali del servizio:<br>1. <strong style=\"font-weight:700\">Rimozione delicata del colore<\u002Fstrong> – Procedura che schiarisce o elimina il colore artificiale dai capelli senza intaccare eccessivamente la struttura capillare.<br>2. <strong style=\"font-weight:700\">Base per una nuova colorazione<\u002Fstrong> – Essenziale per correggere colori indesiderati o preparare il capello a una nuova tonalità più chiara o diversa.<br>3. <strong style=\"font-weight:700\">Trattamento progressivo<\u002Fstrong> – Può essere effettuato in più fasi per preservare la salute del capello e ridurre i danni.<\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-18\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">1.20 Piega<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Questo servizio può essere prenotato <strong style=\"font-weight:700\">come trattamento singolo<\u002Fstrong> oppure <strong style=\"font-weight:700\">come parte di un servizio di colorazione o trattamento specifico<\u002Fstrong>.<br><br>Include: shampoo, conditioner, styling<\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-19\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">1.21 Lavoro complesso<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">E’ l’intervento che prevede l’uso di tecniche miste o di un insieme di tecniche (<a href=\"#q-37\" style=\"color:#b4553a;text-decoration:underline\">air touch<\u002Fa>, <a href=\"#q-36\" style=\"color:#b4553a;text-decoration:underline\">balayage<\u002Fa>, <a href=\"#q-35\" style=\"color:#b4553a;text-decoration:underline\">meches<\u002Fa>, colpi di sole, <a href=\"#q-62\" style=\"color:#b4553a;text-decoration:underline\">permanente<\u002Fa>, ecc.) e trattamenti differenti.<br><br>Prima di prenotare un servizio di questo tipo, occorre effettuare una <a href=\"#q-2\" style=\"color:#b4553a;text-decoration:underline\">consulenza<\u002Fa> dedicata e l e:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-21\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">1.23 Detox<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Trattamento di pulizia profonda. Purifica i capelli da inquinanti e metalli pesanti.<\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-79\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">1.24 Riflessologia Plantare vs. Trattamento Metamorfico<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\"><p style=\"margin:0 0 14px\">La Riflessologia Plantare lavora principalmente attraverso la stimolazione dei punti riflessi del piede, mentre il Trattamento Metamorfico si basa su un tocco delicato volto a favorire il rilassamento profondo, l'equilibrio interiore e i naturali processi di trasformazione della persona.<\u002Fp><sc-raw-table style=\"width:100%;border-collapse:collapse;table-layout:fixed;break-inside:avoid\"><sc-raw-thead><sc-raw-tr><sc-raw-th style=\"border:1px solid #d8d0c6;padding:10px 14px;text-align:left;font-weight:500;font-size:14px;background:#f6f2ee;color:#2b2622;width:50%\">Riflessologia Plantare<\u002Fsc-raw-th><sc-raw-th style=\"border:1px solid #d8d0c6;padding:10px 14px;text-align:left;font-weight:500;font-size:14px;background:#f6f2ee;color:#2b2622;width:50%\">Trattamento Metamorfico<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td style=\"border:1px solid #d8d0c6;padding:10px 14px 4px;vertical-align:top;font-size:13.5px;line-height:1.55\"><ul style=\"margin:0;padding-left:18px\"><li style=\"margin:0 0 6px\">Stimola specifici punti riflessi del piede collegati ai vari organi e apparati.<\u002Fli><li style=\"margin:0 0 6px\">Ha un approccio più strutturato e mirato al riequilibrio della persona attraverso la stimolazione delle zone riflesse.<\u002Fli><li style=\"margin:0 0 6px\">Il professionista lavora su punti specifici in base alle esigenze della persona.<\u002Fli><li style=\"margin:0 0 6px\">Il trattamento prevede pressioni e manipolazioni di diversa intensità.<\u002Fli><li style=\"margin:0 0 6px\"><em style=\"font-style:italic\">Attenzione: il trattamento <u>non deve<\u002Fu> essere eseguito in gravidanza.<\u002Fem><\u002Fli><li style=\"margin:0 0 6px\"><a href=\"#q-74\" style=\"color:#b4553a;text-decoration:underline\">Riflessologia Plantare<\u002Fa><\u002Fli><\u002Ful><\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #d8d0c6;padding:10px 14px 4px;vertical-align:top;font-size:13.5px;line-height:1.55\"><ul style=\"margin:0;padding-left:18px\"><li style=\"margin:0 0 6px\">Utilizza un tocco molto leggero su piedi, mani e testa lungo la cosiddetta \"linea del riflesso spinale\".<\u002Fli><li style=\"margin:0 0 6px\">Ha un approccio più delicato e non direttivo, volto a favorire processi di trasformazione interiore e rilascio di schemi profondi.<\u002Fli><li style=\"margin:0 0 6px\">L'operatore non \"interviene\" su un problema specifico, ma crea le condizioni affinché la persona attivi le proprie risorse interiori.<\u002Fli><li style=\"margin:0 0 6px\">Il contatto è estremamente leggero, rilassante e non invasivo.<\u002Fli><li style=\"margin:0 0 6px\"><em style=\"font-style:italic\">Attenzione: il trattamento può essere eseguito anche durante la gravidanza.<\u002Fem><\u002Fli><li style=\"margin:0 0 6px\"><a href=\"#q-77\" style=\"color:#b4553a;text-decoration:underline\">Trattamento Metamorfico<\u002Fa><\u002Fli><\u002Ful><\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>< r-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-41\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">3.10 Camouflage di barba e baffi<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Attenua i peli bianchi della barba e dei baffi con una sfumatura naturale, valorizzando i lineamenti del viso senza modificare il colore in modo evidente.<br><br>Può essere utile per:<ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">Rendere barba e baffi più omogenei e definiti.<\u002Fli><li style=\"margin:0 0 4px\">Donare un aspetto più fresco e ordinato.<\u002Fli><li style=\"margin:0 0 4px\">Ottenere un risultato naturale in pochi minuti.<\u002Fli><\u002Ful>Informazioni utili:<ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\"><a href=\"#q-2\" style=\"color:#b4553a;text-decoration:underline\">Consulenza<\u002Fa><\u002Fli><li style=\"margin:0 0 4px\"><a href=\"#q-7\" style=\"color:#b4553a;text-decoration:underline\">Il prezzo del servizio<\u002Fa><\u002Fli><\u002Ful><\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><\u002Fsection><section id=\"s-4\" style=\"margin:0 0 8px\"><h2 style=\"margin:36px 0 18px;padding:0 0 8px;border-bottom:1px solid #d8d0c6;font-family:'Libre Baskerville',Georgia,serif;font-weight:400;font-size:24px;line-height:1.25;text-transform:uppercase;letter-spacing:.03em;color:#2b2622\">4. Capelli - Trattamenti<\u002Fh2><div id=\"q-42\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">4.1 Protocollo di trattamento<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Durante <a href=\"#q-2\" style=\"color:#b4553a;text-decoration:underline\">la consulenza<\u002Fa>, in base alle preferenze del cliente e alle condizioni del cuoio capelluto e dei capelli, vengono definiti:<ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">il tipo di trattamento più indicato<\u002Fli><li style=\"margin:0 0 4px\">il marchio più adatto al trattamento scelto<\u002Fli><\u002Ful>Durante il trattamento devono essere seguiti i seguenti passaggi:<ol style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">Shampoo/Scrab per<\u002Fli><\u002Fol><ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">pulizia<\u002Fli><li style=\"margin:0 0 4px\">preparazione del cuoio capelluto e dei capelli<\u002Fli><\u002Ful>2. Applicazione di prodotti mirati per la ricostruzione del capello<br>3. Sciacquo con H2O<br>4. Applicazione Maschera / fissatore - applicazione di prodotti mirati per la finalizzazione del trattamento (per idratare e nutrire i capelli e/o incrementarne la lucentezza)<br>5. Sciacquo (se necessario) con H2O<\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-43\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">4.2 Anti-forfora<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Il <a href=\"#q-42\" style=\"color:#b4553a;text-decoration:underline\">Protocollo di trattamento<\u002Fa> fornisce informazioni dettagliate sulle fasi e le modalità di esecuzione del servizio.<ol style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Desquamazione del cuoio capelluto<\u002Fstrong> – Riduce la formazione di forfora secca o grassa, elimi =\"font-weight:700\">Stimolazione della microcircolazione<\u002Fstrong> – Favorisce l'ossigenazione e il nutrimento dei follicoli piliferi, contribuendo a ridurre la caduta dei capelli e a stimolarne la crescita.<\u002Fli><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Regolazione dell'equilibrio della cute<\u002Fstrong> – Aiuta a normalizzare la produzione di sebo, riducendo l'eccessiva untuosità nei capelli grassi o contrastando la secchezza del cuoio capelluto.<\u002Fli><\u002Fol>Informazioni utili:<ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\"><a href=\"#q-2\" style=\"color:#b4553a;text-decoration:underline\">Consulenza<\u002Fa><\u002Fli><li style=\"margin:0 0 4px\"><a href=\"#q-7\" style=\"color:#b4553a;text-decoration:underline\">Il prezzo del servizio<\u002Fa><\u002Fli><\u002Ful><\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-45\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">4.4 Anti-caduta<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Il <a href=\"#q-42\" style=\"color:#b4553a;text-decoration:underline\">Protocollo di trattamento<\u002Fa> fornisce informazioni dettagliate sulle fasi e le modalità di esecuzione del servizio.<ol style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Diradamento dei capelli<\u002Fstrong> – Rinforza i follicoli piliferi, stimolando la crescita di nuovi capelli e aumentando la densità della chioma.<\u002Fli><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Indebolimento del fusto capillare<\u002Fstrong> – Nutre e rinforza la fibra capillare, riducendo la fragilità e la rottura prematura dei capelli.<\u002Fli><li style=\ px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">4.9 Lucentezza assoluta<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Il <a href=\"#q-42\" style=\"color:#b4553a;text-decoration:underline\">Protocollo di trattamento<\u002Fa> fornisce informazioni dettagliate sulle fasi e le modalità di esecuzione del servizio.<ol style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Opacità e mancanza di luminosità<\u002Fstrong> – Restituisce brillantezza ai capelli spenti, donando un effetto luminoso e sano.<\u002Fli><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Disidratazione e secchezza<\u002Fstrong> – Migliora l’idratazione della fibra capillare, rendendo i capelli più morbidi ed elastici.<\u002Fli><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Capelli crespi e porosi<\u002Fstrong> – Leviga la cuticola del capello, riducendo l’effetto crespo e migliorando la setosità della chioma.<\u002Fli><\u002Fol>Informazioni utili:<ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\"><a href=\"#q-2\" style=\"color:#b4553a;text-decoration:underline\">Consulenza<\u002Fa><\u002Fli><li style=\"margin:0 0 4px\"><a href=\"#q-7\" style=\"color:#b4553a;text-decoration:underline\">Il prezzo del servizio<\u002Fa><\u002Fli><\u002Ful><\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-52\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">4.10 Stiratura alla cheratina<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Perché non facciamo?<br>Perché qualsiasi manipolazione chimica (che viene accelerata notevolmente dal calore e cambia la struttura del capello) danneggia il capello.<br>Il problema potrebbe non essere visibile immediatamente, ma dopo un paio di mesi il danno sarà evidente.<br>Al contrario, una procedura chimica che modifica la struttura dei capelli in un lasso di tempo più lungo impatterà meno sulla struttura del capello.<\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><\u002Fsection><section id=\"s-5\" style=\"margin:0 0 8px\"><h2 style=\"margin:36px 0 18px;padding:0 0 8px;border-bottom:1px solid #d8d0c6;font-family:'Libre Baskerville',Georgia,serif;font-weight:400;font-size:24px;line-height:1.25;text-transform:uppercase;letter-spacing:.03em;color:#2b2622\">5. capelli - Permanente<\u002Fh2><div id=\"q-62\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">5.1 Protocollo del servizio permanente<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Durante il servizio devono essere seguiti i seguenti passaggi:<ol style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">Shampoo tecnico per lavaggio profondo<\u002Fli><li style=\"margin:0 0 4px\">Applicazione bigodini<\u002Fli><li style=\"margin:0 0 4px\">Applicazione del prodotto<\u002Fli><li style=\"margin:0 0 4px\">Sciacquo con H2O<\u002Fli><li style=\"margin:0 0 4px\">Applicazione fissatore<\u002Fli><li style=\"margin:0 0 4px\">Sciacquo con H2O<\u002Fli><li style=\"margin:0 0 4px\">Trattamento finale curativo<\u002Fli><li style=\"margin:0 0 4px\"><a href=\"#q-18\" style=\"color:#b4553a;text-decoration:underline\">piega<\u002Fa> (si aggiunge separatamente a ogni prenotazione)<\u002Fli><\u002Fol>Incluso in ogni servizio:<ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">applicazione dei bigodini e del prodotto<\u002Fli><li style=\"margin:0 0 4px\"><a href=\"#q-14\" style=\"color:#b4553a;text-decoration:underline\">trattamento di base<\u002Fa><\u002Fli><\u002Ful><\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-63\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">5.2 Neutral Wave (Goldwell)<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">E’ una permanente neutra ad alte prestazioni che offre risultati duraturi e rispettosi della struttura del capello. Le sue tre caratteristiche principali sono: <ol style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Tecnologia a pH neutro<\u002Fstrong>: Opera nell'intervallo di pH neutro, garantendo una maggiore delicatezza sulla fibra capillare e preservando l'integrità dei capelli durante il processo di ondulazione.<\u002Fli><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Sistema Auto-Bilanciante con film protettivo brevettato<\u002Fstrong>: Assicura onde uniformi dalle radici alle punte, proteggendo le zone più fragili dei capelli e garantendo risultati affidabili.<\u002Fli><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Integrazione di lipidi nutrienti<\u002Fstrong>: Durante il trattamento, i lipidi preziosi iniziano a condizionare i capelli, migliorandone l'elasticità e la luminosità per un aspetto sano e naturale.<\u002Fli><\u002Fol>Il <a href=\"#q-62\" style=\"color:#b4553a;text-decoration:underline\">Protocollo del servizio permanente<\u002Fa> fornisce informazioni dettagliate sulle fasi e le modalità di esecuzione del servizio.<br><br>Informazioni utili:<ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\"><a href=\"#q-2\" style=\"color:#b4553a;text-decoration:underline\">Consulenza<\u002Fa><\u002Fli><li style=\"margin:0 0 4px\"><a href=\"#q-7\" style=\"color:#b4553a;text-decoration:underline\">Il prezzo del servizio<\u002Fa><\u002Fli><\u002Ful><\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-64\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">5.3 Balance Curling System (Davines)<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">E’ un sistema permanente che offre risultati uniformi, capelli lucenti e morbidi dalle radici alle punte. Le sue tre caratteristiche principali sono: <ol style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Formula senza ammoniaca<\u002Fstrong>: Utilizza ammonio tioglicolato al posto dell'ammoniaca, riducendo l'odore forte e minimizzando i danni alla struttura del capello.<\u002Fli><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Arricchito con derivati vegetali<\u002Fstrong>: La sua composizione include ingredienti di origine vegetale con elevato potere condizionante, che proteggono e idratano i capelli durante il trattamento permanente.<\u002Fli><li style=\"margin:0 0 4px\"><strong style=\"font-weight:700\">Risultati elastici e lucenti<\u002Fstrong>: Garantisce onde naturali ed elastiche dalla radice alla punta, assicurando uno styling morbido e naturale anche su capelli danneggiati.<\u002Fli><\u002Fol>Il <a href=\"#q-62\" style=\"color:#b4553a;text-decoration:underline\">Protocollo del servizio permanente<\u002Fa> fornisce informazioni dettagliate sulle fasi e le modalità di esecuzione del servizio.<br><br>Informazioni utili:<ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\"><a href=\"#q-2\" style=\"color:#b4553a;text-decoration:underline\">Consulenza<\u002Fa><\u002Fli><li style=\"margin:0 0 4px\"><a href=\"#q-7\" style=\"color:#b4553a;text-decoration:underline\">Il prezzo del servizio<\u002Fa><\u002Fli><\u002Ful><\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><\u002Fsection><section id=\"s-6\" style=\"margin:0 0 8px\"><h2 style=\"margin:36px 0 18px;padding:0 0 8px;border-bottom:1px solid #d8d0c6;font-family:'Libre Baskerville',Georgia,serif;font-weight:400;font-size:24px;line-height:1.25;text-transform:uppercase;letter-spacing:.03em;color:#2b2622\">6. viso - Trucco<\u002Fh2><div id=\"q-65\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">6.1 Trucco express<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Make-up rapido ed essenziale, pensato per valorizzare il viso in tempi contenuti. Ideale per un appuntamento improvviso, un evento last-minute o per rinfrescare l’aspetto con un risultato curato e naturale.<\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-66\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">6.2 Trucco da giorno<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Make-up naturale e luminoso, realizzato per esaltare la bellezza del viso in modo equilibrato. Adatto ad attività lavorative, appuntamenti diurni e momenti informali, garantisce un look fresco e ordinato che dura nel tempo.<\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-67\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">6.3 Trucco da sera<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Make-up strutturato e più intenso, progettato per valorizzare il viso sotto luci artificiali e in contesti serali. Ideale per eventi, cene, cerimonie o occasioni speciali, con particolare attenzione alla definizione degli occhi e alla tenuta prolungata.<\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><\u002Fsection><section id=\"s-7\" style=\"margin:0 0 8px\"><h2 style=\"margin:36px 0 18px;padding:0 0 8px;border-bottom:1px solid #d8d0c6;font-family:'Libre Baskerville',Georgia,serif;font-weight:400;font-size:24px;line-height:1.25;text-transform:uppercase;letter-spacing:.03em;color:#2b2622\">7. viso - Massaggio<\u002Fh2><div id=\"q-78\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">7.1 Massaggio Kobido (lifting giaponese)<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Il Massaggio Kobido è un antico trattamento viso giapponese che, attraverso manualità ritmiche e profonde, stimola la microcircolazione, tonifica i tessuti e dona al viso un aspetto naturalmente più luminoso e disteso. <br><br>Può essere utile per: <ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">Ridurre la comparsa di rughe e segni di espressione.<\u002Fli><li style=\"margin:0 0 4px\">Migliorare tonicità, elasticità e luminosità della pelle.<\u002Fli><li style=\"margin:0 0 4px\">Rilassare le tensioni del viso favorendo un effetto lifting naturale.<\u002Fli><\u002Ful>Informazioni utili:<ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\"><a href=\"#q-2\" style=\"color:#b4553a;text-decoration:underline\">Consulenza<\u002Fa><\u002Fli><li style=\"margin:0 0 4px\"><a href=\"#q-7\" style=\"color:#b4553a;text-decoration:underline\">Il prezzo del servizio<\u002Fa><\u002Fli><\u002Ful><\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><\u002Fsection><section id=\"s-8\" style=\"margin:0 0 8px\"><h2 style=\"margin:36px 0 18px;padding:0 0 8px;border-bottom:1px solid #d8d0c6;font-family:'Libre Baskerville',Georgia,serif;font-weight:400;font-size:24px;line-height:1.25;text-transform:uppercase;letter-spacing:.03em;color:#2b2622\">8. viso - Sopraciglia<\u002Fh2><div id=\"q-68\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">8.1 Rifinitura/Modellazione sopracciglia<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Trattamento mirato alla definizione e all’armonia della forma delle sopracciglia, eseguito in base alla struttura del viso. Prevede la pulizia e la rifinitura per ottenere un risultato ordinato, naturale e proporzionato.<\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-69\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">8.2 Colorazione/Schiaritura sopracciglia<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Servizio dedicato alla correzione e all’equilibrio del colore delle sopracciglia, attraverso tecniche di colorazione o schiaritura. Ideale per intensificare, armonizzare o alleggerire il tono, valorizzando lo sguardo in modo elegante e naturale.<\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><\u002Fsection><section id=\"s-9\" style=\"margin:0 0 8px\"><h2 style=\"margin:36px 0 18px;padding:0 0 8px;border-bottom:1px solid #d8d0c6;font-family:'Libre Baskerville',Georgia,serif;font-weight:400;font-size:24px;line-height:1.25;text-transform:uppercase;letter-spacing:.03em;color:#2b2622\">9. Medicina alternativa - Benessere olistico<\u002Fh2><div id=\"q-74\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">9.1 Riflessologia plantare<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">La riflessologia plantare è una tecnica manuale che, attraverso la stimolazione di specifici punti del piede, favorisce il rilassamento e il benessere generale della persona. <br><br>Può essere utile per: <ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">favorire il rilassamento e alleviare le tensioni;<\u002Fli><li style=\"margin:0 0 4px\">regalare una piacevole sensazione di leggerezza e benessere;<\u002Fli><li style=\"margin:0 0 4px\">migliorare la percezione del proprio equilibrio psicofisico;<\u002Fli><li style=\"margin:0 0 4px\">concedersi un momento di cura e attenzione verso sé stessi.<\u002Fli><\u002Ful>Informazioni utili: <ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\"><a href=\"#q-2\" style=\"color:#b4553a;text-decoration:underline\">Consulenza<\u002Fa><\u002Fli><li style=\"margin:0 0 4px\"><a href=\"#q-7\" style=\"color:#b4553a;text-decoration:underline\">Il prezzo del servizio<\u002Fa><\u002Fli><li style=\"margin:0 0 4px\"><a href=\"#q-79\" style=\"color:#b4553a;text-decoration:underline\">Riflessologia Plantare vs. Trattamento Metamorfico<\u002Fa><\u002Fli><\u002Ful><\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-77\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">9.2 Trattamento metamorfico<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Il Trattamento Metamorfico è una tecnica che prevede uno sfioramento leggerissimo dei punti riflessi della colonna vertebrale situati su piedi, mani e testa. L'obiettivo e'liberare i blocchi emotivi accumulati fin dal periodo prenatale, stimolando la forza vitale e l'auto-guarigione della persona. <br><br>Può essere utile per: <ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">favorire rilassamento e distensione;<\u002Fli><li style=\"margin:0 0 4px\">⁠aiutare a ridurre le tensioni e lo stress della vita quotidiana;<\u002Fli><li style=\"margin:0 0 4px\">sostenere una sensazione di equilibrio e benessere generale.<\u002Fli><\u002Ful>Informazioni utili: <ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\"><a href=\"#q-2\" style=\"color:#b4553a;text-decoration:underline\">Consulenza<\u002Fa><\u002Fli><li style=\"margin:0 0 4px\"><a href=\"#q-7\" style=\"color:#b4553a;text-decoration:underline\">Il prezzo del servizio<\u002Fa><\u002Fli><li style=\"margin:0 0 4px\"><a href=\"#q-79\" style=\"color:#b4553a;text-decoration:underline\">Riflessologia Plantare vs. Trattamento Metamorfico<\u002Fa><\u002Fli><\u002Ful><\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-75\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">9.3 Fiori di Bach<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">I Fiori di Bach sono rimedi floreali ideati dal medico inglese Edward Bach, pensati per favorire l'equilibrio emotivo e il benessere della persona. Vengono scelti in base allo stato emotivo individuale e utilizzati come supporto in un percorso di armonia e consapevolezza. <br><br>Possono essere utili per: <ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">sostenere la gestione di stress e tensioni emotive;<\u002Fli><li style=\"margin:0 0 4px\">favorire calma e serenità;<\u002Fli><li style=\"margin:0 0 4px\">aumentare la fiducia in sé stessi;<\u002Fli><li style=\"margin:0 0 4px\">accompagnare i cambiamenti e i momenti di particolare sensibilità emotiva.<\u002Fli><\u002Ful>La caratteristica principale del servizio - approccio personalizzato: la scelta dei rimedi si basa sulle caratteristiche e sulle emozioni della persona, non sul sintomo fisico.<br><br>Informazioni utili: <ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\"><a href=\"#q-2\" style=\"color:#b4553a;text-decoration:underline\">Consulenza<\u002Fa><\u002Fli><li style=\"margin:0 0 4px\"><a href=\"#q-7\" style=\"color:#b4553a;text-decoration:underline\">Il prezzo del servizio<\u002Fa><\u002Fli><\u002Ful><\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><div id=\"q-76\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">9.4 Reiki<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">Il Reiki è una pratica di origine giapponese che mira a favorire il rilassamento e il benessere attraverso un trattamento energetico eseguito con una delicata imposizione delle mani. Viene spesso scelto come momento di ascolto, armonia e riequilibrio interiore. <br><br>Può essere utile per: <ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">favorire il rilassamento profondo; <\u002Fli><li style=\"margin:0 0 4px\">ridurre la percezione di stress e tensione emotiva; <\u002Fli><li style=\"margin:0 0 4px\">ritrovare serenità e concentrazione; <\u002Fli><li style=\"margin:0 0 4px\">concedersi un momento dedicato al proprio benessere.<\u002Fli><\u002Ful>Informazioni utili: <ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\"><a href=\"#q-2\" style=\"color:#b4553a;text-decoration:underline\">Consulenza<\u002Fa> <\u002Fli><li style=\"margin:0 0 4px\"><a href=\"#q-7\" style=\"color:#b4553a;text-decoration:underline\">Il prezzo del servizio<\u002Fa><\u002Fli><\u002Ful><\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><\u002Fsection><section id=\"s-10\" style=\"margin:0 0 8px\"><h2 style=\"margin:36px 0 18px;padding:0 0 8px;border-bottom:1px solid #d8d0c6;font-family:'Libre Baskerville',Georgia,serif;font-weight:400;font-size:24px;line-height:1.25;text-transform:uppercase;letter-spacing:.03em;color:#2b2622\">10. servizi esclusivi - FOTO<\u002Fh2><div id=\"q-73\" style=\"margin:0 0 22px\"><h3 style=\"margin:0 0 8px;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:16px;line-height:1.35;color:#2b2622\">10.1 Ritratto classico (Portrait), Corporate / Business, Headshot (primo piano stretto)<\u002Fh3><div style=\"font-size:14px;line-height:1.6;color:#373737\">1. <strong style=\"font-weight:700\">Ritratto classico (Portrait)<\u002Fstrong> - Perfetto per immagine personale, clienti privati <ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">Focus su viso ed espressione <\u002Fli><li style=\"margin:0 0 4px\">Sfondo neutro o pulito <\u002Fli><li style=\"margin:0 0 4px\">Luce morbida e curata <\u002Fli><\u002Ful>2. <strong style=\"font-weight:700\">Corporate / Business<\u002Fstrong> - Ideale per professionisti e imprenditori <ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">Foto professionali per lavoro (LinkedIn, sito, CV) <\u002Fli><li style=\"margin:0 0 4px\">Look pulito, elegante, autorevole <\u002Fli><li style=\"margin:0 0 4px\">Spesso mezzo busto o primo piano <\u002Fli><\u002Ful>3. <strong style=\"font-weight:700\">Headshot (primo piano stretto)<\u002Fstrong> - Sempre più richiesto anche per social <ul style=\"margin:0 0 10px;padding-left:22px\"><li style=\"margin:0 0 4px\">Solo volto (spesso per attori, profili professionali) <\u002Fli><li style=\"margin:0 0 4px\">Molto tecnico, luce precisa<\u002Fli><\u002Ful><\u002Fdiv><a href=\"#content\" style=\"display:inline-block;margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#857164;text-decoration:none\">↑ Content<\u002Fa><\u002Fdiv><\u002Fsection><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdoc-page>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {}\n<\u002Fscript>\n\n<script>\n(function(){\n  try{history.scrollRestoration='manual';}catch(e){}\n  function targetId(){\n    var n=new URLSearchParams(location.search).get('open');\n    if(n&&/^\\d+$/.test(n)) return 'q-'+n;\n    var h=decodeURIComponent((location.hash||'').slice(1));\n    if(/^\\d+$/.test(h)) return 'q-'+h;\n    return h||null;\n  }\n  function flash(el){\n    el.style.transition='background-color 1.2s ease';\n    el.style.backgroundColor='rgba(180,85,58,.12)';\n    setTimeout(function(){el.style.backgroundColor='';},1600);\n  }\n  function go(highlight){\n    var id=targetId(); if(!id) return;\n    var tries=0, done=false, userMoved=false;\n    function stop(){userMoved=true;}\n    ['wheel','touchstart','keydown','mousedown'].forEach(function(t){window.addEventListener(t,stop,{once:true,passive:true});});\n    function jump(){ if(userMoved) return; var el=document.getElementById(id); if(el) el.scrollIntoView({block:'start'}); return el; }\n    (function wait(){\n      var el=jump();\n      if(el&&!done){\n        done=true;\n        if(highlight) setTimeout(function(){var e=document.getElementById(id); if(e) flash(e);},300);\n        [150,400,800,1500,2500].forEach(function(t){setTimeout(jump,t);});\n        if(document.fonts&&document.fonts.ready) document.fonts.ready.then(jump);\n        return;\n      }\n      if(!el&&++tries<100) setTimeout(wait,100);\n    })();\n  }\n  window.addEventListener('hashchange',function(){go(false);});\n  go(true);\n})();\n<\u002Fscript>\n<\u002Fbody><\u002Fhtml>"</script>
